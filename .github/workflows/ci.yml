name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    name: Validate API and web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint, format, test, and build web
        run: |
          npm run lint --workspace apps/web
          npm run format:check --workspace apps/web
          npm run test --workspace apps/web -- --watch=false
          npm run build --workspace apps/web -- --configuration production

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Verify API (including Testcontainers integration tests)
        working-directory: apps/api
        run: bash ./mvnw -B verify

      - name: Install API modules for dependency analysis
        working-directory: apps/api
        run: bash ./mvnw -B -DskipTests install

      - name: Audit Java dependencies
        working-directory: apps/api
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw -B org.owasp:dependency-check-maven:check -DnvdApiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7

  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  docker-build:
    name: Build container images (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: kithlore-api:ci
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: kithlore-web:ci
