<ng-container *transloco="let t">
  <div class="min-h-screen bg-stone-950 text-stone-100">
    <header class="border-b border-white/10">
      <nav
        class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5"
        aria-label="{{ t('navigation.label') }}"
      >
        <a class="text-xl font-semibold tracking-tight text-amber-200" href="/">{{
          t('brand.name')
        }}</a>
        <span class="text-sm text-stone-400">{{ t('brand.tagline') }}</span>
      </nav>
    </header>

    <main
      class="mx-auto grid min-h-[calc(100vh-5rem)] max-w-6xl items-center gap-12 px-6 py-16 md:grid-cols-[1.2fr_0.8fr]"
    >
      <section class="space-y-7">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-amber-300">
          {{ t('home.eyebrow') }}
        </p>
        <h1 class="max-w-3xl text-5xl font-semibold leading-tight tracking-tight md:text-7xl">
          {{ t('home.title') }}
        </h1>
        <p class="max-w-xl text-lg leading-8 text-stone-300">{{ t('home.description') }}</p>
        <div class="flex flex-wrap items-center gap-4">
          <span
            class="rounded-full border border-amber-300/30 bg-amber-300/10 px-4 py-2 text-sm text-amber-100"
            >{{ t('home.badge') }}</span
          >
          <span class="text-sm text-stone-400">{{ t('home.comingSoon') }}</span>
        </div>
      </section>

      <aside
        class="rounded-3xl border border-white/10 bg-white/[0.04] p-8 shadow-2xl shadow-black/20"
        aria-labelledby="api-status-title"
      >
        <p class="text-sm font-medium uppercase tracking-[0.18em] text-stone-400">
          {{ t('api.label') }}
        </p>
        <h2 id="api-status-title" class="mt-3 text-2xl font-semibold">{{ t('api.title') }}</h2>
        <app-api-status />
        <p class="mt-6 border-t border-white/10 pt-5 text-sm leading-6 text-stone-400">
          {{ t('api.description') }}
        </p>
      </aside>
    </main>
  </div>
</ng-container>
