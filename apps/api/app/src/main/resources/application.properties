spring.application.name=kithlore-api
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kithlore}
spring.datasource.username=${DATABASE_USERNAME:kithlore}
spring.datasource.password=${DATABASE_PASSWORD:kithlore}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

springdoc.api-docs.path=/openapi
springdoc.swagger-ui.path=/docs

kithlore.security.jwt-secret=${JWT_SECRET:}

logging.config=classpath:logback-spring.xml
